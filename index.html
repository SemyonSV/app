<main id="main"></main><button class="fab" data-act="edit" aria-label="Изменить">✎</button><nav id="nav"></nav>
<script>
const DEF={"bonus": 1250, "look": {"accent":"#2ba85c","font":100,"round":100}, "pay": {"m":"октябрь","y":"2026","title":"Погасить платёж","sub":"По займам за октябрь"}, "cardsTitle":"Карты и счета","newCardText":"Открыть новую карту", "currency": "₸", "initials": "ИФ", "updated": "01.10.2026", "tabs": ["Главная", "Мой банк", "Переводы", "Платежи"], "centerTitle": "Центр", "centerText": "Здесь можно разместить любой текст или картинку", "numbersTab": 1, "items": [["Основной счёт", 77724.19, "• 9421"], ["Накопления", 150000, "• 2242"], ["Депозит", 82500, "KZ00 0000 0000 0000"], ["Резерв", 24000, "• 3621"]], "banners": [{"title": "Заголовок баннера", "text": "короткая подпись", "color": "#1f7a52"}, {"title": "Второй баннер", "text": "ещё подпись", "color": "#1b8fd1"}], "services": ["Карты", "Вклады", "Займы", "Инвест", "Магазин", "Поездки", "Защита", "Услуги"], "stripTitle": "Все сервисы", "strip": [{"title": "Еда"}, {"title": "Рост"}, {"title": "Кино"}, {"title": "Здоровье"}, {"title": "Продукты"}], "segments": [{"name": "Еда", "cards": [{"title": "Бургер с двойной котлетой"}, {"title": "Кофе на растительном молоке"}, {"title": "Ужин с самовывозом"}, {"title": "Праздничный плов"}]}, {"name": "Поездки", "cards": [{"title": "Выходные у моря"}, {"title": "Горный маршрут"}]}, {"name": "Магазин", "cards": [{"title": "Новинки недели"}, {"title": "Скидки дня"}]}], "moreButton": "Показать больше", "lists": {"2": [["Между своими счетами", "Картами и счетами"], ["По номеру счёта", "Физ. и юр. лицам"], ["Международные", "В любую точку мира"], ["Запросить перевод", "По номеру телефона"]], "3": [["Мобильная связь", "Пополнить номер"], ["Коммунальные услуги", "Свет, вода, газ"], ["Интернет и ТВ", "Оплата по договору"], ["Штрафы", "Проверить и оплатить"]]}};
let S,I,edit=false,cur=0,curSeg=0;
try{S=JSON.parse(localStorage.getItem('s'))}catch(e){}
S=Object.assign({},DEF,S||{});
try{I=JSON.parse(localStorage.getItem('i'))||{}}catch(e){I={}}
const save=()=>{try{localStorage.setItem('s',JSON.stringify(S));localStorage.setItem('i',JSON.stringify(I))}catch(e){alert('Не хватает места для картинки. Удалите лишние картинки или выберите поменьше.')}};
const get=p=>p.split('.').reduce((o,k)=>o==null?o:o[k],S);
const set=(p,v)=>{const a=p.split('.'),l=a.pop();a.reduce((o,k)=>o[k],S)[l]=v};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Number(n).toLocaleString('ru-RU',{minimumFractionDigits:Number(n)%1?2:0,maximumFractionDigits:2});
const total=()=>S.items.reduce((s,x)=>s+Number(x[1]),0);
const bgi=(p,col)=>I[p]?'style="background-image:url('+I[p]+')"':(col?'style="background:'+esc(col)+'"':'');
const P=(p,t,x)=>'<'+(t||'span')+' data-p="'+p+'"'+(x||'')+'>'+esc(get(p))+'</'+(t||'span')+'>';
const Sv=d=>'<svg viewBox="0 0 24 24">'+d+'</svg>';
const IC=['<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/>','<path d="M9 4h6l1 3H8z"/><path d="M8 7c-3 3-4 6-4 9a4 4 0 0 0 4 4h8a4 4 0 0 0 4-4c0-3-1-6-4-9"/>','<rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>','<path d="M4 9l8-5 8 5-8 5zM4 15l8 5 8-5"/>','<path d="M3 5h3l2 10h10l2-7H7"/><circle cx="9" cy="19" r="1"/><circle cx="17" cy="19" r="1"/>','<path d="M3 13l18-8-6 15-3-6z"/>','<path d="M12 3l8 3v6c0 5-4 8-8 9-4-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5L16 9.5"/>','<path d="M3 9l9-5 9 5M5 9v9M9.5 9v9M14.5 9v9M19 9v9M3 20h18"/>'];
const NAV=['<path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/>','<path d="M4 8h15a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M4 8l12-3v3M16 13.5h4"/>','<path d="M5 8h14l-4-4M19 16H5l4 4"/>','<path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 9h6M9 13h6"/>'];
const QRI='<path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M8 9h2v2H8zM14 9h2v2h-2zM8 14h2v2H8zM14 14h2v2h-2z"/>';
const main=document.getElementById('main'),nav=document.getElementById('nav');
function topbar(){return '<div class="top">'+P('initials','div',' class="av"')+'<div class="pill s">Поиск</div><div class="pill" data-p="bonus" data-n="1">'+fmt(S.bonus)+'</div><svg class="chat" viewBox="0 0 24 24"><path d="M4 20l1.5-4A8 8 0 1 1 8 18.5z"/></svg></div>'}
function numbers(i){
 const GL='<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>',SH='<svg viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-4 8-8 9-4-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5L16 9.5"/></svg>';
 const rows=S.items.map((x,k)=>{const p='items.'+k;
  return '<div class="arow"><div class="tile" data-i="'+p+'" '+bgi(p)+'>'+(I[p]?'':Sv(IC[0]))+'</div><div class="atxt"><div class="ahead"><span data-p="'+p+'.0">'+esc(x[0])+'</span><b><span data-p="'+p+'.1" data-n="1">'+fmt(x[1])+'</span> '+esc(S.currency)+'<span class="x" data-act="del" data-k="'+k+'">✕</span></b></div><div class="asub" data-p="'+p+'.2">'+esc(x[2]||(edit?'добавить подпись':''))+'</div><div class="aic">'+GL+SH+'</div></div></div>'}).join('');
 const L=S.look;
 return '<h1>'+P('tabs.'+i)+'</h1>'+
 '<div class="pay"><div class="badge"><span data-p="pay.m">'+esc(S.pay.m)+'</span><span data-p="pay.y">'+esc(S.pay.y)+'</span></div><div><div class="pt" data-p="pay.title">'+esc(S.pay.title)+'</div><div class="ps" data-p="pay.sub">'+esc(S.pay.sub)+'</div></div></div>'+
 '<div class="card" style="margin-top:calc(var(--u)*24)"><div class="chead"><span class="h2" data-p="cardsTitle">'+esc(S.cardsTitle)+'</span><span class="hide" data-act="toggle">'+(S.hideCards?'Показать ⌄':'Скрыть ⌃')+'</span></div>'+
 (S.hideCards?'':rows+'<div class="arow add"><div class="tile plus">+</div><div class="atxt"><span class="newc" data-p="newCardText">'+esc(S.newCardText)+'</span></div></div>')+'</div>'+
 '<p class="sub eo">Валюта: '+P('currency')+'</p>'+
 '<div class="card eo lk"><div class="h2" style="margin:calc(var(--u)*14) 0">Внешний вид</div>'+
 '<label>Цвет акцента<input type="color" data-look="accent" value="'+esc(L.accent)+'"></label>'+
 '<label>Размер текста<input type="range" min="80" max="130" data-look="font" value="'+L.font+'"></label>'+
 '<label>Скругление углов<input type="range" min="0" max="160" data-look="round" value="'+L.round+'"></label></div>'+
 '<button class="btn" data-act="add">+ Добавить карту или счёт</button><button class="btn" data-act="export">Сохранить копию в файл</button><button class="btn" data-act="import">Загрузить копию из файла</button><button class="btn" data-act="reset">Сбросить всё к начальному виду</button>';
}
function home(){
 return topbar()+'<div class="ban">'+S.banners.map((b,k)=>'<div class="b" data-i="banners.'+k+'" '+bgi('banners.'+k,b.color)+'>'+(I['banners.'+k]&&!edit?'':P('banners.'+k+'.title','h3')+P('banners.'+k+'.text','p'))+'<span class="bt" data-act="img" data-path="banners.'+k+'">🖼</span><span class="bt r" data-act="rmimg" data-path="banners.'+k+'">✕</span></div>').join('')+'</div>'+
 '<div class="card w" style="margin-top:0"><div class="grid">'+S.services.map((s,k)=>'<div>'+Sv(IC[k%8])+P('services.'+k)+'</div>').join('')+'</div></div>'+
 '<div class="card w"><div class="h">'+P('stripTitle')+'</div><div class="strip">'+S.strip.map((o,k)=>'<div class="si"><i data-i="strip.'+k+'" '+bgi('strip.'+k)+'></i>'+P('strip.'+k+'.title')+'</div>').join('')+'</div></div>'+
 '<div class="seg">'+S.segments.map((s,k)=>'<button data-seg="'+k+'" class="'+(k===curSeg?'on':'')+'">'+esc(s.name)+'</button>').join('')+'</div>'+
 '<div class="cg">'+(S.segments[curSeg]||{cards:[]}).cards.map((c,k)=>{const p='segments.'+curSeg+'.cards.'+k;return '<div class="c"><i data-i="'+p+'" '+bgi(p)+'></i>'+P(p+'.title')+'</div>'}).join('')+'</div>'+
 '<button class="more" data-p="moreButton">'+esc(S.moreButton)+'</button>';
}
function listPage(i){return '<h1>'+P('tabs.'+i)+'</h1><div class="card" style="margin-top:calc(var(--u)*24)">'+((S.lists||{})[i]||[]).map((x,k)=>'<div class="row"><span>'+P('lists.'+i+'.'+k+'.0')+'<small data-p="lists.'+i+'.'+k+'.1">'+esc(x[1])+'</small></span></div>').join('')+'</div>'}
function center(){return '<h1>'+P('centerTitle')+'</h1><p class="sub">'+P('centerText')+'</p><div class="ph '+(I.centerImg?'on':'')+'" data-i="centerImg" '+bgi('centerImg')+'></div>'}
function apply(){const L=S.look||DEF.look,r=document.documentElement.style;
 const h=/^#[0-9a-f]{6}$/i.test(L.accent)?L.accent:'#2ba85c',n=parseInt(h.slice(1),16),m=c=>Math.round(c+(255-c)*.86);
 r.setProperty('--g',h);r.setProperty('--gs','rgb('+m(n>>16)+','+m(n>>8&255)+','+m(n&255)+')');r.setProperty('--ft',L.font/100);r.setProperty('--rd',L.round/100)}
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.look;if(!k)return;S.look[k]=k==='accent'?e.target.value:+e.target.value;apply();save()});
function render(){
 apply();
 const st=main.scrollTop;
 main.innerHTML=[0,1,2,3].map(i=>'<section class="page'+(i===0&&i!==S.numbersTab?' home':'')+'" data-t="'+i+'">'+(i===S.numbersTab?numbers(i):i===0?home():listPage(i))+'</section>').join('')+'<section class="page" data-t="qr">'+center()+'</section>';
 nav.innerHTML=[0,1,'qr',2,3].map(k=>k==='qr'?'<button class="qr" data-tab="qr"><span>'+Sv(QRI)+'</span></button>':'<button data-tab="'+k+'">'+Sv(NAV[k]).replace('<svg',k===0?'<svg class="f"':'<svg')+esc(S.tabs[k])+'</button>').join('');
 document.body.classList.toggle('ed',edit);
 show(cur,true);main.scrollTop=st;
}
function show(k,keep){
 cur=k;
 main.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.dataset.t==k));
 nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.tab==k));
 if(!keep)main.scrollTop=0;
}
function pick(path){
 const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
 inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{const m=1400,s=Math.min(1,m/Math.max(im.width,im.height));
   const c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
   I[path]=c.toDataURL('image/jpeg',.82);save();render()};im.src=r.result};r.readAsDataURL(f)};
 inp.click();
}
async function exportData(){
 const name='backup-'+new Date().toISOString().slice(0,10)+'.json';
 const f=new File([JSON.stringify({v:1,s:S,i:I})],name,{type:'application/json'});
 try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}catch(e){if(e&&e.name==='AbortError')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=name;document.body.append(a);a.click();a.remove();
}
function importData(){
 const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
 inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||typeof d.s!=='object'||!Array.isArray(d.s.items))throw 0;
   if(!confirm('Заменить текущие данные данными из файла?'))return;
   S=Object.assign({},DEF,d.s);I=d.i||{};save();render()}catch(e){alert('Это не файл резервной копии')}};r.readAsText(f)};
 inp.click();
}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-tab]');if(t){show(t.dataset.tab==='qr'?'qr':+t.dataset.tab);return}
 const a=e.target.closest('[data-act]');
 if(a){const k=a.dataset.act;
  if(k==='edit'){edit=!edit;render()}
  else if(k==='img'){pick(a.dataset.path)}
  else if(k==='rmimg'){delete I[a.dataset.path];save();render()}
  else if(k==='export'){exportData()}
  else if(k==='import'){importData()}
  else if(k==='add'){S.items.push(['Новая карта',0,'• 0000']);save();render()}
  else if(k==='toggle'){S.hideCards=!S.hideCards;save();render()}
  else if(k==='del'){const d=+a.dataset.k;S.items.splice(d,1);const N={};Object.keys(I).forEach(key=>{const m=key.match(/^items\.(\d+)$/);if(!m)N[key]=I[key];else{const j=+m[1];if(j<d)N[key]=I[key];else if(j>d)N['items.'+(j-1)]=I[key]}});I=N;save();render()}
  else if(k==='reset'&&confirm('Сбросить все тексты, числа и картинки?')){localStorage.clear();location.reload()}
  return}
 const sg=e.target.closest('[data-seg]');
 if(sg){const i=+sg.dataset.seg;if(edit&&i===curSeg){const v=prompt('Название вкладки:',S.segments[i].name);if(v!=null){S.segments[i].name=v;save()}}else curSeg=i;render();return}
 if(!edit)return;
 const p=e.target.closest('[data-p]');
 if(p){const path=p.dataset.p,v=prompt('Изменить:',get(path)==null?'':get(path));if(v==null)return;
  if(p.dataset.n){const n=parseFloat(v.replace(/\s/g,'').replace(',','.'));if(isNaN(n)){alert('Введите число');return}set(path,n)}else set(path,v);
  save();render();return}
 const im=e.target.closest('[data-i]');if(im)pick(im.dataset.i);
});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script></body></html>
