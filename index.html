<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Мой банк">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Мой банк</title>
<style>
:root{color-scheme:light;--u:calc(100vw / 1186);--bg:#f7f7f7;--card:#fff;--text:#14213d;--muted:#8a90a0;--g:#2ba85c;--gs:#e9f6ee;--line:#e8e9ec}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100dvh;margin:0;background:var(--bg);color:var(--text)}
body{height:100dvh;font:calc(var(--u)*38) -apple-system,system-ui,sans-serif;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;padding-bottom:calc(var(--u)*30)}
.page:not(.home){padding-top:env(safe-area-inset-top,0px)}
.page{display:none}.page.on{display:block}
.top{position:sticky;top:0;z-index:5;display:flex;gap:calc(var(--u)*24);align-items:center;padding:calc(env(safe-area-inset-top,0px) + var(--u)*20) calc(var(--u)*54) calc(var(--u)*24) calc(var(--u)*54);background:var(--card)}
.av{width:calc(var(--u)*96);height:calc(var(--u)*96);border-radius:50%;background:#eef0f6;display:flex;align-items:center;justify-content:center}
.pill{height:calc(var(--u)*96);border-radius:calc(var(--u)*48);background:#eef0f6;display:flex;align-items:center;padding:0 calc(var(--u)*30);font-weight:600;white-space:nowrap}
.pill.s{flex:1;color:var(--muted);font-weight:400}
.chat{width:calc(var(--u)*72);height:calc(var(--u)*72);fill:none;stroke:var(--g);stroke-width:2}
.ban{display:flex;gap:calc(var(--u)*28);overflow-x:auto;padding:calc(var(--u)*26) calc(var(--u)*43);scrollbar-width:none}
.ban::-webkit-scrollbar{display:none}
.b{flex:0 0 calc(var(--u)*782);height:calc(var(--u)*322);border-radius:calc(var(--u)*40);background-size:cover;background-position:center;color:#fff;padding:calc(var(--u)*40);display:flex;flex-direction:column;justify-content:center}
.b h3{margin:0 0 8px;font-size:calc(var(--u)*50);max-width:60%}.b p{margin:0;font-size:calc(var(--u)*34);opacity:.9;max-width:60%}
.card{background:var(--card);border-radius:calc(var(--u)*46);margin:calc(var(--u)*24) calc(var(--u)*43) 0;padding:calc(var(--u)*40)}
.card.w{margin:calc(var(--u)*24) 0 0;border-radius:calc(var(--u)*46) calc(var(--u)*46) 0 0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);row-gap:calc(var(--u)*40)}
.grid div{text-align:center;font-size:calc(var(--u)*38)}
.grid svg{display:block;margin:0 auto calc(var(--u)*14);width:calc(var(--u)*100);height:calc(var(--u)*100);fill:none;stroke:var(--g);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.h{font-size:calc(var(--u)*50);font-weight:700;margin:0 0 calc(var(--u)*34)}
.strip{display:flex;gap:calc(var(--u)*40);overflow-x:auto;scrollbar-width:none}.strip::-webkit-scrollbar{display:none}
.si{flex:0 0 calc(var(--u)*172);text-align:center;font-size:calc(var(--u)*36)}
.si i{display:block;width:calc(var(--u)*172);height:calc(var(--u)*118);border-radius:calc(var(--u)*34);background:var(--gs) center/cover;margin-bottom:calc(var(--u)*14)}
.seg{display:flex;background:#eceef1;border-radius:calc(var(--u)*34);padding:calc(var(--u)*8);margin:calc(var(--u)*34) calc(var(--u)*43) 0}
.seg button{flex:1;border:0;background:none;font:inherit;font-size:calc(var(--u)*42);padding:calc(var(--u)*22) 0;border-radius:calc(var(--u)*28);color:var(--text)}
.seg button.on{background:#fff;box-shadow:0 1px 4px #0002}
.cg{display:grid;grid-template-columns:1fr 1fr;gap:calc(var(--u)*68);padding:calc(var(--u)*34) calc(var(--u)*110) 0}
.c{background:#fff;border-radius:calc(var(--u)*40);padding:calc(var(--u)*24) calc(var(--u)*24) calc(var(--u)*30);font-size:calc(var(--u)*38);min-height:calc(var(--u)*520)}
.c i{display:block;width:100%;aspect-ratio:1/0.84;border-radius:calc(var(--u)*28);background:var(--gs) center/cover;margin-bottom:calc(var(--u)*20)}
.more{display:block;width:calc(100% - var(--u)*86);margin:calc(var(--u)*40) auto 0;height:calc(var(--u)*110);border:0;border-radius:calc(var(--u)*30);background:var(--g);color:#fff;font:inherit;font-size:calc(var(--u)*44)}
h1{font-size:calc(var(--u)*100);margin:calc(var(--u)*60) calc(var(--u)*54) calc(var(--u)*10)}
.sub{color:var(--muted);margin:0 calc(var(--u)*54) calc(var(--u)*34);font-size:calc(var(--u)*36)}
.total{background:var(--g);color:#fff;border-radius:calc(var(--u)*46);margin:0 calc(var(--u)*43);padding:calc(var(--u)*50)}
.total small{opacity:.9;font-size:calc(var(--u)*36)}.total b{display:block;font-size:calc(var(--u)*96);margin-top:8px}
.row{display:flex;justify-content:space-between;gap:12px;padding:calc(var(--u)*38) 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}.row b{color:var(--g);white-space:nowrap}.row small{display:block;color:var(--muted);font-size:calc(var(--u)*36);margin-top:4px}
.qrv{margin:calc(var(--u)*34) 0 0;height:calc(var(--u)*1100);background:#3a3a3e center/cover;color:#fff;text-align:center;padding:calc(var(--u)*50) calc(var(--u)*120);font-size:calc(var(--u)*50);font-weight:600;position:relative}
.qrv:after{content:"";position:absolute;left:calc(var(--u)*208);top:calc(var(--u)*500);width:calc(var(--u)*770);height:calc(var(--u)*570);border:3px solid #fff;border-radius:12px}
nav{display:flex;align-items:flex-end;background:var(--card);border-top:1px solid var(--line);padding:calc(var(--u)*14) 0 env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;color:#555d6b;font:inherit;font-size:calc(var(--u)*34);font-weight:600;padding:calc(var(--u)*6) 0 calc(var(--u)*12);display:flex;flex-direction:column;align-items:center;gap:calc(var(--u)*8)}
nav button svg{width:calc(var(--u)*64);height:calc(var(--u)*64);fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--g)}nav button.on svg.f{fill:var(--g)}
nav button.qr{flex:0 0 calc(var(--u)*240)}
nav button.qr span{width:calc(var(--u)*120);height:calc(var(--u)*120);border-radius:50%;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center;margin-bottom:calc(var(--u)*12)}
nav button.qr svg{width:calc(var(--u)*68);height:calc(var(--u)*68)}

.fab{position:fixed;right:calc(var(--u)*30);bottom:calc(var(--u)*250 + env(safe-area-inset-bottom,0px));z-index:9;width:calc(var(--u)*110);height:calc(var(--u)*110);border-radius:50%;border:0;background:var(--g);color:#fff;font-size:calc(var(--u)*50);opacity:.18}
body.ed .fab{opacity:1}
body.ed [data-p]{outline:1px dashed #2ba85c99;outline-offset:2px}
body.ed [data-i]{outline:2px dashed #2ba85c}
.ph{display:none;height:calc(var(--u)*500);margin:0 calc(var(--u)*43);border-radius:calc(var(--u)*40);background:var(--gs) center/cover}
.ph.on,body.ed .ph{display:block}
.btn{display:block;width:calc(100% - var(--u)*86);margin:calc(var(--u)*30) auto 0;height:calc(var(--u)*100);border:0;border-radius:calc(var(--u)*30);background:var(--gs);color:var(--g);font:inherit;font-size:calc(var(--u)*42);display:none}
body.ed .btn{display:block}
.x{color:#d33;float:right;margin-left:12px;display:none}body.ed .x{display:inline}
</style></head><body>
<main id="main"></main><button class="fab" data-act="edit" aria-label="Изменить">✎</button><nav id="nav"></nav>
<script>
const DEF={"currency": "₸", "initials": "ИФ", "updated": "01.10.2026", "tabs": ["Главная", "Мой банк", "Переводы", "Платежи"], "centerTitle": "Центр", "centerText": "Здесь можно разместить любой текст или картинку", "numbersTab": 1, "items": [["Основной счёт", 77724.19], ["Накопления", 150000], ["Депозит", 82500], ["Резерв", 24000]], "banners": [{"title": "Заголовок баннера", "text": "короткая подпись", "color": "#1f7a52"}, {"title": "Второй баннер", "text": "ещё подпись", "color": "#1b8fd1"}], "services": ["Карты", "Вклады", "Займы", "Инвест", "Магазин", "Поездки", "Защита", "Услуги"], "stripTitle": "Все сервисы", "strip": [{"title": "Еда"}, {"title": "Рост"}, {"title": "Кино"}, {"title": "Здоровье"}, {"title": "Продукты"}], "segments": [{"name": "Еда", "cards": [{"title": "Бургер с двойной котлетой"}, {"title": "Кофе на растительном молоке"}, {"title": "Ужин с самовывозом"}, {"title": "Праздничный плов"}]}, {"name": "Поездки", "cards": [{"title": "Выходные у моря"}, {"title": "Горный маршрут"}]}, {"name": "Магазин", "cards": [{"title": "Новинки недели"}, {"title": "Скидки дня"}]}], "moreButton": "Показать больше", "lists": {"2": [["Между своими счетами", "Картами и счетами"], ["По номеру счёта", "Физ. и юр. лицам"], ["Международные", "В любую точку мира"], ["Запросить перевод", "По номеру телефона"]], "3": [["Мобильная связь", "Пополнить номер"], ["Коммунальные услуги", "Свет, вода, газ"], ["Интернет и ТВ", "Оплата по договору"], ["Штрафы", "Проверить и оплатить"]]}};
let S,I,edit=false,cur=0,curSeg=0;
try{S=JSON.parse(localStorage.getItem('s'))}catch(e){}
S=Object.assign({},DEF,S||{});
try{I=JSON.parse(localStorage.getItem('i'))||{}}catch(e){I={}}
const save=()=>{try{localStorage.setItem('s',JSON.stringify(S));localStorage.setItem('i',JSON.stringify(I))}catch(e){alert('Не хватает места для картинки. Удалите лишние картинки или выберите поменьше.')}};
const get=p=>p.split('.').reduce((o,k)=>o==null?o:o[k],S);
const set=(p,v)=>{const a=p.split('.'),l=a.pop();a.reduce((o,k)=>o[k],S)[l]=v};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>Number(n).toLocaleString('ru-RU',{minimumFractionDigits:Number(n)%1?2:0,maximumFractionDigits:2});
const total=()=>S.items.reduce((s,x)=>s+Number(x[1]),0);
const bgi=(p,col)=>I[p]?'style="background-image:url('+I[p]+')"':(col?'style="background:'+esc(col)+'"':'');
const P=(p,t,x)=>'<'+(t||'span')+' data-p="'+p+'"'+(x||'')+'>'+esc(get(p))+'</'+(t||'span')+'>';
const Sv=d=>'<svg viewBox="0 0 24 24">'+d+'</svg>';
const IC=['<rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/>','<path d="M9 4h6l1 3H8z"/><path d="M8 7c-3 3-4 6-4 9a4 4 0 0 0 4 4h8a4 4 0 0 0 4-4c0-3-1-6-4-9"/>','<rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>','<path d="M4 9l8-5 8 5-8 5zM4 15l8 5 8-5"/>','<path d="M3 5h3l2 10h10l2-7H7"/><circle cx="9" cy="19" r="1"/><circle cx="17" cy="19" r="1"/>','<path d="M3 13l18-8-6 15-3-6z"/>','<path d="M12 3l8 3v6c0 5-4 8-8 9-4-1-8-4-8-9V6z"/><path d="M8.5 12l2.5 2.5L16 9.5"/>','<path d="M3 9l9-5 9 5M5 9v9M9.5 9v9M14.5 9v9M19 9v9M3 20h18"/>'];
const NAV=['<path d="M4 11l8-7 8 7v8a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/>','<path d="M4 8h15a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M4 8l12-3v3M16 13.5h4"/>','<path d="M5 8h14l-4-4M19 16H5l4 4"/>','<path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 9h6M9 13h6"/>'];
const QRI='<path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3M8 9h2v2H8zM14 9h2v2h-2zM8 14h2v2H8zM14 14h2v2h-2z"/>';
const main=document.getElementById('main'),nav=document.getElementById('nav');
function topbar(){return '<div class="top">'+P('initials','div',' class="av"')+'<div class="pill s">Поиск</div><div class="pill">'+fmt(total())+'</div><svg class="chat" viewBox="0 0 24 24"><path d="M4 20l1.5-4A8 8 0 1 1 8 18.5z"/></svg></div>'}
function numbers(i){
 return '<h1>'+P('tabs.'+i)+'</h1><p class="sub">Обновлено: '+P('updated')+(edit?' · валюта: '+P('currency'):'')+'</p>'+
 '<div class="total"><small>Всего</small><b>'+fmt(total())+' '+esc(S.currency)+'</b></div><div class="card" style="margin-top:calc(var(--u)*24)">'+
 S.items.map((x,k)=>'<div class="row"><span>'+P('items.'+k+'.0')+'</span><b>'+'<span data-p="items.'+k+'.1" data-n="1">'+fmt(x[1])+'</span> '+esc(S.currency)+'<span class="x" data-act="del" data-k="'+k+'">✕</span></b></div>').join('')+'</div>'+
 '<button class="btn" data-act="add">+ Добавить строку</button><button class="btn" data-act="reset">Сбросить всё к начальному виду</button>';
}
function home(){
 return topbar()+'<div class="ban">'+S.banners.map((b,k)=>'<div class="b" data-i="banners.'+k+'" '+bgi('banners.'+k,b.color)+'>'+P('banners.'+k+'.title','h3')+P('banners.'+k+'.text','p')+'</div>').join('')+'</div>'+
 '<div class="card w" style="margin-top:0"><div class="grid">'+S.services.map((s,k)=>'<div>'+Sv(IC[k%8])+P('services.'+k)+'</div>').join('')+'</div></div>'+
 '<div class="card w"><div class="h">'+P('stripTitle')+'</div><div class="strip">'+S.strip.map((o,k)=>'<div class="si"><i data-i="strip.'+k+'" '+bgi('strip.'+k)+'></i>'+P('strip.'+k+'.title')+'</div>').join('')+'</div></div>'+
 '<div class="seg">'+S.segments.map((s,k)=>'<button data-seg="'+k+'" class="'+(k===curSeg?'on':'')+'">'+esc(s.name)+'</button>').join('')+'</div>'+
 '<div class="cg">'+(S.segments[curSeg]||{cards:[]}).cards.map((c,k)=>{const p='segments.'+curSeg+'.cards.'+k;return '<div class="c"><i data-i="'+p+'" '+bgi(p)+'></i>'+P(p+'.title')+'</div>'}).join('')+'</div>'+
 '<button class="more" data-p="moreButton">'+esc(S.moreButton)+'</button>';
}
function listPage(i){return '<h1>'+P('tabs.'+i)+'</h1><div class="card" style="margin-top:calc(var(--u)*24)">'+((S.lists||{})[i]||[]).map((x,k)=>'<div class="row"><span>'+P('lists.'+i+'.'+k+'.0')+'<small data-p="lists.'+i+'.'+k+'.1">'+esc(x[1])+'</small></span></div>').join('')+'</div>'}
function center(){return '<h1>'+P('centerTitle')+'</h1><p class="sub">'+P('centerText')+'</p><div class="ph '+(I.centerImg?'on':'')+'" data-i="centerImg" '+bgi('centerImg')+'></div>'}
function render(){
 const st=main.scrollTop;
 main.innerHTML=[0,1,2,3].map(i=>'<section class="page'+(i===0&&i!==S.numbersTab?' home':'')+'" data-t="'+i+'">'+(i===S.numbersTab?numbers(i):i===0?home():listPage(i))+'</section>').join('')+'<section class="page" data-t="qr">'+center()+'</section>';
 nav.innerHTML=[0,1,'qr',2,3].map(k=>k==='qr'?'<button class="qr" data-tab="qr"><span>'+Sv(QRI)+'</span></button>':'<button data-tab="'+k+'">'+Sv(NAV[k]).replace('<svg',k===0?'<svg class="f"':'<svg')+esc(S.tabs[k])+'</button>').join('');
 document.body.classList.toggle('ed',edit);
 show(cur,true);main.scrollTop=st;
}
function show(k,keep){
 cur=k;
 main.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.dataset.t==k));
 nav.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.tab==k));
 if(!keep)main.scrollTop=0;
}
function pick(path){
 const inp=document.createElement('input');inp.type='file';inp.accept='image/*';
 inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{const m=900,s=Math.min(1,m/Math.max(im.width,im.height));
   const c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
   I[path]=c.toDataURL('image/jpeg',.82);save();render()};im.src=r.result};r.readAsDataURL(f)};
 inp.click();
}
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-tab]');if(t){show(t.dataset.tab==='qr'?'qr':+t.dataset.tab);return}
 const a=e.target.closest('[data-act]');
 if(a){const k=a.dataset.act;
  if(k==='edit'){edit=!edit;render()}
  else if(k==='add'){S.items.push(['Новая строка',0]);save();render()}
  else if(k==='del'){S.items.splice(+a.dataset.k,1);save();render()}
  else if(k==='reset'&&confirm('Сбросить все тексты, числа и картинки?')){localStorage.clear();location.reload()}
  return}
 const sg=e.target.closest('[data-seg]');
 if(sg){const i=+sg.dataset.seg;if(edit&&i===curSeg){const v=prompt('Название вкладки:',S.segments[i].name);if(v!=null){S.segments[i].name=v;save()}}else curSeg=i;render();return}
 if(!edit)return;
 const p=e.target.closest('[data-p]');
 if(p){const path=p.dataset.p,v=prompt('Изменить:',get(path));if(v==null)return;
  if(p.dataset.n){const n=parseFloat(v.replace(/\s/g,'').replace(',','.'));if(isNaN(n)){alert('Введите число');return}set(path,n)}else set(path,v);
  save();render();return}
 const im=e.target.closest('[data-i]');if(im)pick(im.dataset.i);
});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
render();
</script></body></html>
